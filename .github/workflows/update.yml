name: Refresh orbits and predictions
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install sgp4==2.24 numpy
      - run: python pipeline/update.py
      - name: Commit new data
        run: |
          git config user.name "fallen-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "Refresh orbits $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
